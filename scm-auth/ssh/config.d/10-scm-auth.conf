# Managed by linux-configs (scm-auth family) - local edits are overwritten on reinstall.
#
# SCM hosts (github, gitlab, gitea, codeberg, bitbucket, tangled, huggingface, ...) get keys from ONE
# agent: the one in $SSH_AUTH_SOCK, i.e. gcr-ssh-agent (/run/user/$UID/gcr/ssh). The login keyring,
# unlocked by pam_gnome_keyring, holds the key passphrases. That is why this file sets no
# IdentityAgent: an IdentityAgent pin (gpg-agent, a plain ssh-agent, ...) would hide the keyring
# keys. gpg-agent only handles GPG and commit signing.
#
# Hosts join this block by setting 'Tag scm' in their own Host stanza in ~/.ssh/config.
# ~/.ssh/config pulls this file in with 'Include ~/.ssh/config.d/*.conf' as its first line,
# outside any Host/Match block. ssh reads its config in one pass, so on that pass this block runs
# before any 'Tag scm' line further down. A plain 'Match tagged scm' would therefore never match.
# 'final' makes ssh test the block again on its last re-parse, after the Tag has been set.
# ssh keeps the first value it finds for each option, so an option that ~/.ssh/config sets
# outside any Host/Match block (or in 'Host *') still overrides the matching line here.

Match final tagged scm
    IdentitiesOnly yes
    AddKeysToAgent no
    GSSAPIAuthentication no
    PreferredAuthentications publickey
    BatchMode yes
