# Read by systemd (environment.d) and sourced by ~/.profile as POSIX sh, so use only
# NAME="value" lines with $VAR, ${VAR}, ${VAR:-...} and ${VAR:+...}: no $(...),
# backticks, ~ or export. XDG_RUNTIME_DIR is set by pam_systemd, not here.

# --- XDG Base Directories ---
XDG_CACHE_HOME="${XDG_CACHE_HOME:-$HOME/.cache}"
XDG_CONFIG_HOME="${XDG_CONFIG_HOME:-$HOME/.config}"
XDG_DATA_HOME="${XDG_DATA_HOME:-$HOME/.local/share}"
XDG_STATE_HOME="${XDG_STATE_HOME:-$HOME/.local/state}"

# --- XDG User Directories ---
XDG_APPLICATIONS_DIR="${XDG_APPLICATIONS_DIR:-$HOME/.local/share/applications}"
XDG_BIN_DIR="${XDG_BIN_DIR:-$HOME/.local/bin}"
XDG_DESKTOP_DIR="${XDG_DESKTOP_DIR:-$HOME/Desktop}"
XDG_DOCUMENTS_DIR="${XDG_DOCUMENTS_DIR:-$HOME/Documents}"
XDG_DOWNLOADS_DIR="${XDG_DOWNLOADS_DIR:-$HOME/Downloads}"
XDG_LOG_DIR="${XDG_LOG_DIR:-$HOME/.local/state/log}"
XDG_MUSIC_DIR="${XDG_MUSIC_DIR:-$HOME/Music}"
XDG_PICTURES_DIR="${XDG_PICTURES_DIR:-$HOME/Pictures}"
XDG_SCREENSHOTS_DIR="${XDG_SCREENSHOTS_DIR:-$HOME/Pictures/Screenshots}"
XDG_SCREENCASTS_DIR="${XDG_SCREENCASTS_DIR:-$HOME/Videos/Screencasts}"
XDG_VIDEOS_DIR="${XDG_VIDEOS_DIR:-$HOME/Videos}"
