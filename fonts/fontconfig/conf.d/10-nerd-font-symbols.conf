<?xml version="1.0"?>
<!DOCTYPE fontconfig SYSTEM "urn:fontconfig:fonts.dtd">
<fontconfig>

  <!-- append the Symbols Nerd Font as a last-resort fallback so icon glyphs render
       even when the selected monospace font is not a Nerd Font -->
  <match target="pattern">
    <test name="family" qual="any"><string>monospace</string></test>
    <edit name="family" mode="append" binding="weak"><string>Symbols Nerd Font Mono</string></edit>
  </match>

  <match target="pattern">
    <test name="family" qual="any"><string>JetBrainsMono Nerd Font</string></test>
    <edit name="family" mode="append" binding="weak"><string>Symbols Nerd Font Mono</string></edit>
  </match>

  <match target="pattern">
    <test name="family" qual="any"><string>FiraCode Nerd Font</string></test>
    <edit name="family" mode="append" binding="weak"><string>Symbols Nerd Font Mono</string></edit>
  </match>

  <match target="pattern">
    <test name="family" qual="any"><string>FiraMono Nerd Font</string></test>
    <edit name="family" mode="append" binding="weak"><string>Symbols Nerd Font Mono</string></edit>
  </match>

  <match target="pattern">
    <test name="family" qual="any"><string>Mononoki Nerd Font</string></test>
    <edit name="family" mode="append" binding="weak"><string>Symbols Nerd Font Mono</string></edit>
  </match>

  <match target="pattern">
    <test name="family" qual="any"><string>Hack Nerd Font</string></test>
    <edit name="family" mode="append" binding="weak"><string>Symbols Nerd Font Mono</string></edit>
  </match>

  <match target="pattern">
    <test name="family" qual="any"><string>DejaVu Sans Mono</string></test>
    <edit name="family" mode="append" binding="weak"><string>Symbols Nerd Font Mono</string></edit>
  </match>

  <match target="pattern">
    <test name="family" qual="any"><string>Liberation Mono</string></test>
    <edit name="family" mode="append" binding="weak"><string>Symbols Nerd Font Mono</string></edit>
  </match>

  <match target="pattern">
    <test name="family" qual="any"><string>Fira Mono</string></test>
    <edit name="family" mode="append" binding="weak"><string>Symbols Nerd Font Mono</string></edit>
  </match>

</fontconfig>
