<?xml version="1.0"?>
<!DOCTYPE fontconfig SYSTEM "urn:fontconfig:fonts.dtd">
<fontconfig>

  <!-- ===================================================================== -->
  <!-- MICROSOFT / WINDOWS FONT OVERRIDES                                   -->
  <!-- ===================================================================== -->

  <!-- Arial -> Arimo (Pixel-perfect Metric Match) -->
  <match target="pattern">
    <test qual="any" name="family"><string>Arial</string></test>
    <edit name="family" mode="assign" binding="same"><string>Arimo</string></edit>
  </match>

  <!-- Arial Black -> Liberation Sans (Forced Heavy Weight) -->
  <match target="pattern">
    <test qual="any" name="family"><string>Arial Black</string></test>
    <edit name="family" mode="assign" binding="same"><string>Liberation Sans</string></edit>
  </match>

  <!-- Calibri -> Carlito (Metric Match) -->
  <match target="pattern">
    <test qual="any" name="family"><string>Calibri</string></test>
    <edit name="family" mode="assign" binding="same"><string>Carlito</string></edit>
  </match>

  <!-- Cambria -> Caladea (Metric Match) -->
  <match target="pattern">
    <test qual="any" name="family"><string>Cambria</string></test>
    <edit name="family" mode="assign" binding="same"><string>Caladea</string></edit>
  </match>

  <!-- Comic Sans MS -> Comic Relief (Open Source Alternative) -->
  <match target="pattern">
    <test qual="any" name="family"><string>Comic Sans MS</string></test>
    <edit name="family" mode="assign" binding="same"><string>Comic Relief</string></edit>
  </match>

  <!-- Consolas -> Inconsolata / Liberation Mono -->
  <match target="pattern">
    <test qual="any" name="family"><string>Consolas</string></test>
    <edit name="family" mode="assign" binding="same"><string>Inconsolata</string></edit>
  </match>

  <!-- Courier New -> Liberation Mono (Metric Match) -->
  <match target="pattern">
    <test qual="any" name="family"><string>Courier New</string></test>
    <edit name="family" mode="assign" binding="same"><string>Liberation Mono</string></edit>
  </match>

  <!-- Georgia -> Gelasio / Noto Serif -->
  <match target="pattern">
    <test qual="any" name="family"><string>Georgia</string></test>
    <edit name="family" mode="assign" binding="same"><string>Gelasio</string></edit>
  </match>

  <!-- Segoe UI -> Inter (Matches the modern clean geometric UI feel) -->
  <match target="pattern">
    <test qual="any" name="family"><string>Segoe UI</string></test>
    <edit name="family" mode="assign" binding="same"><string>Inter</string></edit>
  </match>

  <!-- Tahoma -> Liberation Sans -->
  <match target="pattern">
    <test qual="any" name="family"><string>Tahoma</string></test>
    <edit name="family" mode="assign" binding="same"><string>Liberation Sans</string></edit>
  </match>

  <!-- Times New Roman -> Tinos (Pixel-perfect Metric Match) -->
  <match target="pattern">
    <test qual="any" name="family"><string>Times New Roman</string></test>
    <edit name="family" mode="assign" binding="same"><string>Tinos</string></edit>
  </match>

  <!-- Trebuchet MS -> Ubuntu / Liberation Sans -->
  <match target="pattern">
    <test qual="any" name="family"><string>Trebuchet MS</string></test>
    <edit name="family" mode="assign" binding="same"><string>Ubuntu</string></edit>
  </match>

  <!-- Verdana -> DejaVu Sans (Excellent wide-kerning match) -->
  <match target="pattern">
    <test qual="any" name="family"><string>Verdana</string></test>
    <edit name="family" mode="assign" binding="same"><string>DejaVu Sans</string></edit>
  </match>

  <!-- ===================================================================== -->
  <!-- APPLE / MACOS / IOS FONT OVERRIDES                                   -->
  <!-- ===================================================================== -->

  <!-- Helvetica -> Liberation Sans (Exact metric width match) -->
  <match target="pattern">
    <test qual="any" name="family"><string>Helvetica</string></test>
    <edit name="family" mode="assign" binding="same"><string>Liberation Sans</string></edit>
  </match>

  <!-- Helvetica Neue -> Inter -->
  <match target="pattern">
    <test qual="any" name="family"><string>Helvetica Neue</string></test>
    <edit name="family" mode="assign" binding="same"><string>Inter</string></edit>
  </match>

  <!-- San Francisco / .SF NS Display / .SF UI Text -> Inter -->
  <match target="pattern">
    <test qual="any" name="family"><string>San Francisco</string></test>
    <edit name="family" mode="assign" binding="same"><string>Inter</string></edit>
  </match>
  <match target="pattern">
    <test qual="any" name="family"><string>System Font</string></test>
    <edit name="family" mode="assign" binding="same"><string>Inter</string></edit>
  </match>

  <!-- Times -> Tinos -->
  <match target="pattern">
    <test qual="any" name="family"><string>Times</string></test>
    <edit name="family" mode="assign" binding="same"><string>Tinos</string></edit>
  </match>

  <!-- Menlo / Monaco -> Liberation Mono -->
  <match target="pattern">
    <test qual="any" name="family"><string>Menlo</string></test>
    <edit name="family" mode="assign" binding="same"><string>Liberation Mono</string></edit>
  </match>
  <match target="pattern">
    <test qual="any" name="family"><string>Monaco</string></test>
    <edit name="family" mode="assign" binding="same"><string>Liberation Mono</string></edit>
  </match>

</fontconfig>
