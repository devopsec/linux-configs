# Prometheus scrape template for GCE VMs (Prometheus 3.15.0 reference pin, checked 2026-10-28).
# Replace <placeholders>. Validate: promtool check config prometheus.yml
global:
  scrape_interval: 30s
  evaluation_interval: 30s
  external_labels:
    env: <prod|stage>
    project: <gcp-project-id>

alerting:
  alertmanagers:
    - static_configs:
        - targets: ['<alertmanager-host>:9093']

rule_files:
  - /etc/prometheus/rules/*.yml

scrape_configs:
  - job_name: prometheus
    static_configs:
      - targets: ['127.0.0.1:9090']

  # Hosts: VMs labelled prometheus=true run node_exporter on 9100
  - job_name: node
    gce_sd_configs:
      - project: <gcp-project-id>
        zone: <zone>
        port: 9100
        filter: 'labels.prometheus = "true"'
    relabel_configs: &gce_relabel
      - source_labels: [__meta_gce_instance_name]
        target_label: instance
      - source_labels: [__meta_gce_label_role]
        target_label: role
      - source_labels: [__meta_gce_zone]
        regex: '.+/zones/(.+)'
        target_label: zone

  # PostgreSQL on VMs (postgres_exporter, role IN ROLE pg_monitor)
  - job_name: postgres
    gce_sd_configs:
      - project: <gcp-project-id>
        zone: <zone>
        port: 9187
        filter: 'labels.role = "db"'
    relabel_configs: *gce_relabel

  # Probe an approved HTTPS service target through blackbox_exporter.
  - job_name: blackbox-https
    metrics_path: /probe
    params:
      module: [http_2xx]
    static_configs:
      - targets: ['https://<service-fqdn>/healthz']
    relabel_configs:
      - source_labels: [__address__]
        target_label: __param_target
      - source_labels: [__param_target]
        target_label: instance
      - target_label: __address__
        replacement: '127.0.0.1:9115'
